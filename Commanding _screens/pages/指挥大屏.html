<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>园区总览 · 脉动智能产线数字孪生调度指挥中心</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    /* 颜色 token —— 归并自现有页面，业务样式只引用 var(--*) */
    --bg-base:#0E3862; --bg-mid:#1C4670; --bg-mid-2:#173F63; --bg-deep:#0B2C47;
    --bg-panel:rgba(27,72,110,.55); --bg-panel-hover:rgba(62,134,180,.45);
    --bg-elevated:#0F3C5E; --bg-mask:rgba(6,26,48,.78);
    --border-base:rgba(150,205,220,.42); --border-soft:rgba(150,205,220,.22);
    --text-primary:#EAF6FF; --text-secondary:#BFD4E2; --text-tertiary:#7FA8BF;
    --brand-cyan:#6FDCEA; --brand-blue:#3E86B4;
    --state-ok:#4FD69B; --state-warn:#F0B75A; --state-danger:#FF5D6C;
    --chart-1:#6FDCEA; --chart-2:#3E86B4; --chart-3:#4FD69B; --chart-4:#F0B75A;
    --chart-fill:rgba(111,220,234,.14); --chart-track:rgba(111,220,234,.18);
    --glow-primary:rgba(111,220,234,.5);
    --gradient-panel:linear-gradient(180deg,rgba(18,62,92,.35),rgba(12,50,76,.2));
    --bg-card-header:rgba(9,38,64,.20);
    --bg-card-kpi:transparent;
    --bg-card-section:rgba(9,38,64,.20);
    --border-card-inner:rgba(150,205,220,.12);
    --border-card-highlight:rgba(111,220,234,.36);
    --gradient-card:linear-gradient(180deg,rgba(18,62,92,.42),rgba(12,50,76,.24));
  }
  html,body{width:100%;height:100%;background:var(--bg-base);overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;color:var(--text-primary);}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  #stage{position:absolute;left:50%;top:50%;width:2600px;height:800px;
    transform-origin:center center;transform:translate(-50%,-50%) scale(var(--s,1));}
  #screen{position:absolute;inset:0;display:flex;flex-direction:column;
    padding:0 20px 24px;
    background:
      url('../assets/images/header-bg-clean.png') center -19px / 100% auto no-repeat,
      radial-gradient(1200px 600px at 50% -10%,rgba(96,178,206,.20),transparent 70%),
      radial-gradient(900px 500px at 100% 100%,rgba(6,26,48,.38),transparent 70%),
      linear-gradient(180deg,var(--bg-mid) 0%,var(--bg-mid-2) 46%,var(--bg-base) 100%);
    overflow:hidden;}
  #screen::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(150,205,220,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(150,205,220,.055) 1px,transparent 1px);
    background-size:44px 44px;}
  #screen::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--brand-cyan),transparent);opacity:.8;}

  /* ---------- header ---------- */
  header{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;
    position:relative;z-index:2;padding:0 12px;}
  .hd-title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    font-size:32px;font-weight:700;letter-spacing:4px;color:var(--text-primary);z-index:1;}
  .hd-title span{color:var(--brand-cyan);margin:0 8px;font-weight:400;font-size:20px;}
  .hd-right{display:flex;align-items:baseline;gap:16px;margin-left:auto;text-align:right;position:relative;z-index:1;}
  .hd-right b{color:var(--text-primary);font-size:20px;font-weight:600;letter-spacing:1px;}
  .hd-right span{font-size:14px;color:var(--text-secondary);}

  /* ---------- 三栏布局 ---------- */
  .main{position:absolute;left:20px;right:20px;top:72px;height:702px;z-index:2;
    display:flex;gap:16px;}
  .side{width:576px;flex:0 0 576px;display:flex;flex-direction:column;gap:16px;min-height:0;}
  .center{width:1376px;flex:0 0 1376px;height:702px;display:flex;flex-direction:column;min-width:0;position:relative;}

  .panel{position:relative;display:flex;flex-direction:column;min-height:0;
    background:var(--bg-panel);border:1px solid var(--border-base);border-radius:2px;}
  .panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--brand-cyan);}
  .panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0;}
  .panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0;}
  .p-head{flex:0 0 40px;display:flex;align-items:center;gap:8px;padding:0 16px;
    border-bottom:1px solid var(--border-soft);font-size:18px;font-weight:600;letter-spacing:1px;}
  .p-head .dia{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
    border-bottom:8px solid var(--brand-cyan);filter:drop-shadow(0 0 4px var(--glow-primary));}
  .p-head .sub{margin-left:auto;font-size:14px;font-weight:400;color:var(--text-secondary);
    background:none;border:0;padding:4px;letter-spacing:0;}
  .p-head .sub:hover{color:var(--brand-cyan);}

  /* 右栏 · 工作站任务详情 / 数字孪生 / 视频监控 */
  [hidden]{display:none!important;}
  /* 任务详情：顶部小标题 + 左视频右信息（参照参考图） */
  .p1{flex:0 0 250px;}
  .task-hd{position:relative;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
    font-size:15px;letter-spacing:1px;color:var(--text-secondary);}
  .task-hd::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:120px;height:1px;
    background:linear-gradient(90deg,transparent,var(--brand-cyan),transparent);}
  .task-row{display:flex;gap:10px;padding:8px 12px 4px;flex:1;min-height:0;}
  .task-media{flex:1.05;min-width:0;min-height:0;overflow:hidden;position:relative;border:1px solid var(--border-soft);border-radius:2px;background:var(--bg-deep);}
  .task-media img,.task-media video{width:100%;height:100%;object-fit:cover;display:block;}
  .task-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:12px;}
  .task-info h3{font-size:19px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-info p{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-info p b{color:var(--brand-cyan);font-weight:600;}
  /* 数字孪生：只展示视频（与视频监控高度等分） */
  .p2{flex:1 1 0;}
  .twin-shot{flex:1;min-height:0;margin:8px 12px 10px;overflow:hidden;position:relative;border:1px solid var(--border-soft);border-radius:2px;background:var(--bg-deep);}
  .twin-shot img,.twin-shot video{width:100%;height:100%;object-fit:cover;display:block;}
  /* 视频监控：全屏做成按钮样式、hover 才显示（与数字孪生高度等分） */
  .p3{flex:1 1 0;}
  .cams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;padding:8px 12px 12px;min-height:0;}
  .cam{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--border-soft);border-radius:2px;overflow:hidden;background:var(--gradient-panel);}
  .cam-view{border:0;background:none;padding:0;flex:1;min-height:0;display:block;width:100%;}
  .cam img{width:100%;height:100%;object-fit:cover;display:block;}
  .cam span{height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary);}
  /* 统一全屏组件：hover 媒体区时右下角显示深蓝圆角方块 + 四角图标 */
  .fs-btn{position:absolute;right:8px;bottom:8px;width:34px;height:34px;z-index:5;
    display:flex;align-items:center;justify-content:center;padding:0;
    border:1px solid var(--brand-cyan);border-radius:6px;
    color:#fff;background:rgba(16,58,110,.92);box-shadow:0 2px 10px rgba(4,20,38,.5);
    opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s;}
  .fs-btn svg{width:18px;height:18px;display:block;}
  .fs-btn:hover{background:rgba(30,90,150,.96);transform:scale(1);}
  .cam .fs-btn{bottom:28px;}
  .task-media:hover .fs-btn,.twin-shot:hover .fs-btn,.cam:hover .fs-btn{opacity:1;transform:scale(1);}
  .cam:hover span{color:var(--brand-cyan);}
  .cam-stage{display:none;position:relative;background:var(--bg-deep);color:var(--text-primary);}
  .cam-stage:fullscreen{display:flex;width:100vw;height:100vh;padding:0;align-items:center;justify-content:center;background:#000;}
  .cam-stage:fullscreen img,.cam-stage:fullscreen video{display:block;width:100%;height:100%;object-fit:contain;}
  .cam-stage:fullscreen img[hidden],.cam-stage:fullscreen video[hidden]{display:none;}
  .cam-stage-bar{display:none;}
  .cam-stage-bar button{height:32px;padding:0 16px;border:1px solid var(--border-base);border-radius:4px;font-size:14px;background:var(--bg-elevated);}

  /* 中间 · 视图切换（模型左侧竖排）/ 工作站入口（模型右侧竖排） */
  .c-top{height:2px;flex:0 0 2px;pointer-events:none;}
  .tabs{position:absolute;left:10px;top:16px;display:flex;flex-direction:column;gap:10px;z-index:6;pointer-events:auto;}
  .tab{width:184px;height:36px;padding:0 14px;font-size:15px;text-align:left;white-space:nowrap;
    border:1px solid var(--border-soft);border-radius:4px;
    color:var(--text-secondary);background:var(--gradient-panel);}
  .tab.active{border-color:var(--brand-cyan);color:var(--text-primary);
    box-shadow:0 0 16px var(--glow-primary) inset,0 0 12px var(--glow-primary);
    background:linear-gradient(180deg,rgba(62,134,180,.45),rgba(10,45,110,.4));}
  .c-tools{position:absolute;right:10px;top:16px;z-index:6;pointer-events:auto;}
  .tool{height:36px;padding:0 16px;font-size:16px;border:1px solid var(--border-soft);border-radius:4px;
    color:var(--text-secondary);background:var(--gradient-panel);}
  .tool:hover{border-color:var(--brand-cyan);color:var(--brand-cyan);}
  .roam-menu{display:none;position:absolute;right:0;top:40px;width:150px;z-index:10;
    background:var(--bg-elevated);border:1px solid var(--border-base);border-radius:4px;overflow:hidden;}
  .roam-menu.open{display:block;}
  .roam-menu button{display:block;width:100%;padding:8px 12px;text-align:left;font-size:14px;
    border:0;border-bottom:1px solid var(--border-soft);background:none;}
  .roam-menu button:hover{background:rgba(111,220,234,.16);color:var(--brand-cyan);}
  /* 右侧按楼层显示的工作站下拉：一层 11 个入口 */
  .station-sel{position:relative;}
  .station-sel>button{width:184px;height:36px;padding:0 18px;font-size:15px;border:1px solid var(--border-base);border-radius:4px;
    color:var(--text-primary);background:linear-gradient(180deg,rgba(62,134,180,.45),rgba(10,45,110,.4));
    box-shadow:0 0 12px var(--glow-primary) inset;}
  .station-sel>button:hover{border-color:var(--brand-cyan);}
  .station-sel>button::after{content:" ▾";color:var(--brand-cyan);}
  .station-pop{display:none;position:absolute;right:0;top:42px;width:184px;z-index:20;padding:10px 10px 12px;
    background:rgba(13,52,86,.96);border:1px solid var(--border-base);border-radius:4px;
    box-shadow:0 12px 40px rgba(4,20,38,.6);}
  .station-pop.open{display:block;}
  .station-pop-hd{display:flex;align-items:center;justify-content:center;margin-bottom:10px;
    font-size:18px;font-weight:600;letter-spacing:1px;}
  .station-pop-grid{display:grid;grid-template-columns:1fr;gap:5px;}
  .station-pop-grid button{height:30px;font-size:13px;border:1px solid var(--border-soft);border-radius:3px;
    background:var(--gradient-panel);color:var(--text-secondary);}
  .station-pop-grid button:hover,.station-pop-grid button.active{border-color:var(--brand-cyan);
    color:var(--brand-cyan);box-shadow:0 0 10px var(--glow-primary) inset;}

  /* 中间 · 模型交互区 1376 × 606 */
  .model{height:658px;flex:0 0 658px;position:relative;overflow:hidden;
    border:1px solid var(--border-base);border-radius:2px;background:var(--bg-deep);}
  .model img{width:100%;height:100%;display:block;object-fit:cover;
    transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;}
  .veil{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:
      linear-gradient(180deg,rgba(11,44,71,.40) 0%,rgba(14,52,80,.18) 9%,rgba(16,58,88,0) 24%,
        rgba(16,58,88,0) 76%,rgba(12,46,74,.20) 91%,rgba(9,38,64,.42) 100%),
      linear-gradient(90deg,rgba(11,44,71,.36) 0%,rgba(14,52,80,.14) 10%,rgba(16,58,88,0) 28%,
        rgba(16,58,88,0) 72%,rgba(12,46,74,.18) 90%,rgba(9,38,64,.36) 100%);}
  .veil-2{position:absolute;inset:0;pointer-events:none;z-index:3;
    box-shadow:inset 0 0 40px 4px rgba(9,38,64,.26);}

  /* 中间 · 底部工具栏 */
  .c-foot{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:flex-start;
    padding:0 12px;font-size:14px;color:var(--text-secondary);
    background:rgba(18,62,92,.35);border:1px solid var(--border-soft);border-radius:4px;}
  .c-foot button{height:32px;padding:0 16px;margin-left:8px;font-size:14px;
    border:1px solid var(--border-soft);border-radius:4px;background:var(--gradient-panel);}
  .c-foot button:hover{border-color:var(--brand-cyan);color:var(--brand-cyan);}
  /* 底部栏：按钮默认隐藏，鼠标移入显示、移出隐藏；浮窗打开时保持可见可点击 */
  .foot-tools{display:flex;align-items:center;position:relative;}
  .foot-tools>button{opacity:0;pointer-events:none;transition:opacity .18s;}
  .c-foot:hover .foot-tools>button,
  .c-foot:has(.foot-menu.open) .foot-tools>button{opacity:1;pointer-events:auto;}
  /* 功能浮窗：独立于 hover，打开后始终可点击 */
  .foot-menu{display:none;position:absolute;left:0;bottom:38px;min-width:176px;z-index:20;
    padding:6px 0;background:rgba(13,52,86,.97);border:1px solid var(--border-base);border-radius:4px;
    box-shadow:0 12px 40px rgba(4,20,38,.6);pointer-events:auto;}
  .foot-menu.open{display:block;}
  .foot-menu button{display:block;width:100%;height:34px;margin:0;padding:0 16px;text-align:center;
    font-size:14px;border:0;border-bottom:1px solid var(--border-soft);background:none;
    opacity:1;pointer-events:auto;}
  .foot-menu button:last-child{border-bottom:0;}
  .foot-menu button:hover{background:rgba(111,220,234,.16);color:var(--brand-cyan);}
  .foot-tools .roam-menu{display:none;}

  /* 右侧 · 数据卡片 */
  .cards{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 190px;gap:16px;}
  .card{overflow:hidden;background:var(--gradient-card);transition:border-color 150ms ease;}
  .card:hover{border-color:var(--border-card-highlight);}
  .card .p-head{position:relative;background:var(--bg-card-header);}
  .card .p-head::after{content:"";position:absolute;left:0;top:0;width:64px;height:2px;background:var(--brand-cyan);}
  .card .p-head .dia{filter:none;}
  /* 详情按钮隐藏，改为点击卡片标题打开详情 */
  .card .detail-btn{display:none;}
  .card .p-head-click{cursor:pointer;}
  .card .p-head-click:hover{color:var(--brand-cyan);}
  .card-body{flex:1;min-height:0;padding:8px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;}
  .kpi-block{padding:4px 8px;border-left:2px solid var(--brand-cyan);border-radius:2px;background:var(--bg-card-kpi);}
  .chart-block{padding:4px 8px;border:1px solid var(--border-card-inner);border-radius:2px;background:var(--bg-card-section);}
  .chart-block>.lbl{margin-bottom:0;}
  .big{font-size:28px;line-height:1.15;font-weight:700;color:var(--brand-cyan);letter-spacing:.5px;margin-bottom:4px;}
  .big small{font-size:14px;color:var(--text-secondary);margin-left:4px;font-weight:400;}
  .lbl{font-size:14px;line-height:1.5;letter-spacing:.5px;color:var(--text-secondary);}
  .mini{font-size:14px;line-height:1.5;letter-spacing:.5px;color:var(--text-secondary);}
  .mini em{font-style:normal;color:var(--state-warn);}
  .card-note{padding-top:4px;border-top:1px solid var(--border-soft);}
  .bars{display:flex;gap:4px;height:16px;align-items:center;}
  .bars i{width:auto;max-width:12px;height:12px;flex:1;border-radius:2px;background:var(--chart-track);}
  .bars i.on{background:linear-gradient(90deg,var(--brand-blue),var(--brand-cyan));}
  .meter{height:8px;border-radius:2px;background:var(--chart-track);overflow:hidden;}
  .meter i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--brand-blue),var(--brand-cyan));}
  .gauge-row{display:flex;align-items:center;gap:12px;}
  .gauge-row svg{width:100px;height:60px;flex:0 0 100px;}
  .gauge-row .big{margin-bottom:0;}
  .gauge-row .mini{font-size:12px;white-space:nowrap;}
  .device-card .gauge-row svg text{font-size:20px;opacity:.72;}
  .device-card .gauge-row .lbl{font-size:12px;color:var(--text-tertiary);}
  .device-card .gauge-row .big{font-size:20px;}
  .device-card .gauge-row .mini{font-size:12px;color:var(--text-tertiary);}
  .trend-block svg{display:block;width:100%;height:44px;}
  .low{display:flex;gap:16px;flex:1;min-width:0;}
  .low>div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;}
  .low .sep{border-left:1px solid var(--border-soft);padding-left:16px;}
  .low svg{width:100%;height:44px;}
  .wide{grid-column:1 / -1;}
  .rbtn{flex:0 0 44px;font-size:18px;letter-spacing:2px;border:1px solid var(--border-soft);border-radius:4px;background:var(--gradient-panel);}
  .rbtn:hover{border-color:var(--brand-cyan);color:var(--brand-cyan);}

  /* 弹窗与提示 */
  .modal{display:none;position:absolute;inset:0;z-index:30;background:var(--bg-mask);
    align-items:center;justify-content:center;}
  .modal-box{width:1740px;max-height:700px;display:flex;flex-direction:column;
    border:1px solid var(--border-base);border-radius:4px;background:var(--bg-elevated);box-shadow:0 0 40px rgba(0,0,0,.5);}
  .modal-head{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:18px;border-bottom:1px solid var(--border-soft);}
  .modal-head button{border:0;background:none;font-size:24px;line-height:1;color:var(--text-secondary);}
  .modal-head button:hover{color:var(--brand-cyan);}
  .modal-body{padding:12px;display:flex;align-items:center;justify-content:center;min-height:0;}
  .modal-body img{max-width:100%;max-height:628px;object-fit:contain;display:block;}
  .toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:40;
    padding:8px 20px;font-size:14px;color:var(--text-primary);background:rgba(11,44,71,.95);
    border:1px solid var(--border-base);border-radius:4px;opacity:0;pointer-events:none;
    transition:opacity .25s;}
  .toast.show{opacity:1;}
  /* 图表 hover 小标签 */
  /* 跟随 #stage 的 --s 等比缩放：标签挂在 stage 外不受 transform 影响，需手动按 --s 缩放，否则相对页面过大 */
  .chart-tip{position:fixed;z-index:80;display:none;pointer-events:none;
    min-width:calc(112px * var(--s,1));max-width:calc(300px * var(--s,1));
    padding:calc(7px * var(--s,1)) calc(11px * var(--s,1));
    border:1px solid var(--border-base);border-radius:calc(3px * var(--s,1));
    background:rgba(8,32,56,.97);box-shadow:0 6px 18px rgba(0,0,0,.4);
    color:var(--text-primary);font-size:calc(12px * var(--s,1));line-height:1.5;white-space:normal;
    font-variant-numeric:tabular-nums;}
  .chart-tip .ct-title{color:var(--brand-cyan);font-weight:600;font-size:inherit;
    margin-bottom:calc(3px * var(--s,1));padding-bottom:calc(3px * var(--s,1));border-bottom:1px solid var(--border-soft);}
  .chart-tip .ct-row{display:flex;justify-content:space-between;align-items:baseline;gap:calc(18px * var(--s,1));line-height:1.7;}
  .chart-tip .ct-k{color:var(--text-secondary);white-space:nowrap;}
  .chart-tip .ct-v{color:var(--text-primary);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}

  /* ================= 视图切换：单个按钮，点击切换 运营分析 / 工厂概况 ================= */
  .view-toggle{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:0 14px;border:1px solid var(--border-base);border-radius:4px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,rgba(18,62,92,.55),rgba(12,50,76,.4));
    transition:border-color .25s,box-shadow .25s,background .25s;}
  .view-toggle:hover{border-color:rgba(111,220,234,.62);background:linear-gradient(180deg,rgba(26,80,115,.62),rgba(12,50,76,.45));
    box-shadow:0 0 14px var(--glow-primary);}
  .view-toggle:active{box-shadow:0 0 8px var(--glow-primary) inset;}
  .view-toggle .vt-ic{width:6px;height:6px;flex:0 0 6px;background:var(--brand-cyan);transform:rotate(45deg);
    box-shadow:0 0 8px var(--glow-primary);}
  .view-toggle .vt-name{font-size:16px;letter-spacing:2px;color:var(--text-primary);
    text-shadow:0 0 8px var(--glow-primary);}
  .metric-view{display:none;flex:1 1 auto;min-height:0;}
  .metric-view.active{display:block;animation:viewIn .42s ease both;}

  /* 运营分析 8 宫格 */
  .ops-grid{height:100%;display:grid;grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(4,1fr);gap:12px;}
  .ops-grid .card{position:relative;overflow:hidden;}
  .ops-grid .card::after{content:"";position:absolute;right:-1px;bottom:-1px;width:46px;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent,var(--brand-cyan)));}
  .ops-card-body{flex:1;min-height:0;padding:8px 12px;display:flex;flex-direction:column;gap:6px;}
  .ops-card-body .p-head{flex:0 0 32px;height:32px;}
  .kpi-pair{display:flex;gap:12px;flex:0 0 auto;}
  .kpi-pair>div{flex:1;min-width:0;padding-left:8px;border-left:2px solid var(--accent,var(--brand-cyan));}
  .kpi-pair.k3{gap:7px;}
  .kpi-pair.k3>div{padding-left:6px;}
  .kpi-pair .v{font-size:21px;line-height:1.1;font-weight:700;color:var(--accent,var(--brand-cyan));
    letter-spacing:.3px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .kpi-pair .v small{font-size:12px;font-weight:400;color:var(--text-secondary);margin-left:2px;}
  .kpi-pair.k3 .v{font-size:17px;}
  .kpi-pair.k3 .v small{font-size:10px;}
  .kpi-pair .k{font-size:11px;color:var(--text-secondary);white-space:nowrap;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;}
  .kpi-pair.k3 .k{font-size:10px;}
  .viz-row{flex:1;min-height:0;display:flex;align-items:stretch;gap:8px;}
  .viz-row .chart-cell{flex:1;min-width:0;position:relative;}
  .viz-row .chart-cell svg{width:100%;height:100%;display:block;overflow:visible;}
  .viz-row .side-cell{flex:0 0 42%;display:flex;flex-direction:column;justify-content:center;gap:4px;
    padding-left:8px;border-left:1px solid var(--border-soft);min-width:0;overflow:hidden;}
  .side-cell .sc{font-size:11px;line-height:1.65;color:var(--text-secondary);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .side-cell .sc b{color:var(--accent,var(--brand-cyan));font-weight:600;}
  .side-cell .sc .lg{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle;}
  .spark-num{position:absolute;right:2px;top:-2px;font-size:10px;color:var(--text-tertiary);}
  .mini-meters{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;width:100%;}
  .mini-meters .mrow{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .mini-meters .mrow .mhead{display:flex;justify-content:space-between;align-items:baseline;gap:2px;}
  .mini-meters .mrow .mn{font-size:10px;color:var(--text-secondary);white-space:nowrap;}
  .mini-meters .mrow .mv{font-size:12px;font-weight:600;color:var(--accent,var(--brand-cyan));font-variant-numeric:tabular-nums;}
  .mini-meters .mrow .mt{height:5px;border-radius:2px;background:var(--chart-track);overflow:hidden;}
  .mini-meters .mrow .mt i{display:block;height:100%;width:0;border-radius:2px;
    background:linear-gradient(90deg,var(--brand-blue),var(--accent,var(--brand-cyan)));
    transition:width 1.1s cubic-bezier(.2,.8,.2,1);}
  .donut-wrap{display:flex;align-items:center;justify-content:flex-end;gap:6px;}
  .donut-wrap svg{width:50px;height:50px;flex:0 0 50px;}
  .donut-legend{font-size:10px;color:var(--text-secondary);line-height:1.55;white-space:nowrap;}
  .donut-legend i{display:inline-block;width:6px;height:6px;border-radius:1px;margin-right:4px;vertical-align:middle;}
  .side-cell:has(.donut-wrap){flex:0 0 46%;}
  .side-cell:has(.mini-meters){flex:0 0 52%;}
  .side-cell .sc.wide-sc{font-size:10px;}

  /* ---------- 聚焦型指标卡：减少元素、放大数字、留白更足 ---------- */
  .ops-grid{gap:13px;}
  /* 实色背景遮住背景网格线，画面更干净 */
  .ops-grid .card{background:linear-gradient(180deg,#154A70,#10395A);}
  .ops-grid .card .p-head{flex:0 0 34px;height:34px;font-size:16px;}
  .ops-card-body.focus{padding:7px 12px;gap:6px;justify-content:flex-start;}
  .mini-cards{display:flex;gap:8px;flex:0 0 auto;}
  .mc{flex:1;min-width:0;padding:3px 9px;border:1px solid var(--border-card-inner);
    border-left:3px solid var(--accent,var(--brand-cyan));border-radius:2px;background:rgba(9,38,64,.28);}
  .mc .mc-v{font-size:18px;font-weight:700;line-height:1.1;color:var(--accent,var(--brand-cyan));
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .mc .mc-v small{font-size:11px;color:var(--text-secondary);font-weight:400;margin-left:2px;}
  .mc .mc-l{font-size:11px;color:var(--text-secondary);margin-top:1px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  /* 工厂产能：大环 + 双信息条 */
  .cap-body{display:flex;align-items:center;gap:10px;flex:1;min-height:0;}
  .cap-ring{flex:0 0 92px;height:92px;}
  .cap-ring svg{width:92px;height:92px;display:block;}
  .cap-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .info-bar{display:flex;align-items:center;gap:7px;padding:2px 8px;border:1px solid var(--border-card-inner);
    border-radius:2px;background:var(--bg-card-section);}
  .info-bar .ib-ic{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;
    font-size:11px;border-radius:3px;background:rgba(111,220,234,.14);color:var(--accent,var(--brand-cyan));}
  .info-bar .ib-t{flex:1;min-width:0;}
  .info-bar .ib-l{font-size:9px;line-height:1.2;color:var(--text-secondary);white-space:nowrap;}
  .info-bar .ib-v{font-size:13px;font-weight:700;color:var(--accent,var(--brand-cyan));line-height:1.2;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .info-bar .ib-v small{font-size:10px;color:var(--text-secondary);font-weight:400;margin-left:2px;}
  /* 订单概况：六边形 + 斜纹对比条 */
  .ord-body{display:flex;align-items:center;gap:10px;flex:1;min-height:0;}
  .hex-wrap{flex:0 0 84px;height:96px;position:relative;}
  .hex-wrap svg{width:84px;height:96px;display:block;}
  .hex-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;pointer-events:none;padding-top:5px;}
  .hex-txt b{font-size:24px;font-weight:700;color:var(--accent,var(--brand-cyan));line-height:1;
    font-variant-numeric:tabular-nums;}
  .hex-txt span{font-size:10px;color:var(--text-secondary);margin-top:3px;}
  .hatch-bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px;}
  .hb-top{display:flex;align-items:baseline;justify-content:space-between;gap:4px;
    font-size:11px;color:var(--text-secondary);}
  .hb-top b{font-size:15px;font-weight:700;color:var(--bar-c,var(--accent,var(--brand-cyan)));
    font-variant-numeric:tabular-nums;}
  .hb-top b small{font-size:10px;font-weight:400;color:var(--text-secondary);margin-left:2px;}
  .hb-track{height:14px;margin-top:4px;border:1px solid var(--border-card-inner);border-radius:2px;
    background:rgba(9,38,64,.3);overflow:hidden;}
  .hb-fill{display:block;height:100%;width:0;border-radius:1px;
    transition:width 1s cubic-bezier(.2,.8,.2,1);
    background:repeating-linear-gradient(115deg,var(--bar-c,var(--accent)) 0 6px,rgba(255,255,255,.18) 6px 12px);}
  /* 设备运行：双环 */
  .ring-pair{display:flex;gap:8px;flex:1;min-height:0;align-items:center;justify-content:space-around;}
  .ring-unit{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0;}
  .ring-unit svg{width:56px;height:56px;display:block;}
  .ring-unit .ru-cap{font-size:11px;color:var(--text-secondary);white-space:nowrap;text-align:center;line-height:1.1;}
  .ring-unit .ru-cap b{color:var(--accent,var(--brand-cyan));font-variant-numeric:tabular-nums;}
  /* 质量管控：双轴面积曲线 */
  .axis-wrap{flex:1;min-height:0;position:relative;}
  .axis-wrap svg{width:100%;height:100%;display:block;}
  /* 仓储：饼图 + 图例 */
  .pie-row{flex:1;min-height:0;display:flex;align-items:center;gap:8px;}
  .pie-row .pie-svg{width:76px;height:76px;flex:0 0 76px;display:block;}
  .pie-legend{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;}
  .pie-legend .pl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-secondary);white-space:nowrap;}
  .pie-legend .pl i{width:7px;height:7px;border-radius:1px;flex:0 0 7px;}
  .pie-legend .pl b{margin-left:auto;color:var(--text-primary);font-variant-numeric:tabular-nums;}
  /* 简卡：KPI + 单图 + 一行注，去侧栏拥挤 */
  .lean-note{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lean-note b{color:var(--accent,var(--brand-cyan));font-weight:600;}
  .lean-chart{flex:1;min-height:0;position:relative;}
  .lean-chart svg{width:100%;height:100%;display:block;}

  /* 绿色低碳：两列三行图标指标（参考图形式） */
  .lc-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(3,1fr);gap:2px 5px;}
  .lc-item{display:flex;align-items:center;min-width:0;min-height:0;gap:3px;}
  .lc-icon{width:31px;height:31px;flex:0 0 31px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 2px 3px rgba(3,20,38,.5));}
  .lc-icon svg{width:100%;height:100%;display:block;}
  .lc-data{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
    justify-content:center;padding:1px 3px 1px 5px;}
  .lc-data::before{content:"";position:absolute;left:-3px;right:3px;top:2px;bottom:2px;
    background:linear-gradient(90deg,rgba(62,134,180,.38),rgba(62,134,180,.08));
    clip-path:polygon(0 0,100% 0,86% 100%,0 100%);}
  .lc-v,.lc-l{position:relative;z-index:1;white-space:nowrap;}
  .lc-v{font-size:18px;line-height:1.08;font-weight:700;color:var(--accent,var(--brand-cyan));
    font-variant-numeric:tabular-nums;letter-spacing:.2px;}
  .lc-l{font-size:10px;line-height:1.2;color:var(--text-primary);margin-top:1px;letter-spacing:.3px;}

  /* 智慧物流：三指标卡 + 配送状态分段条（替代原曲线） */
  .lg-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;}
  .lg-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:0 0 auto;}
  .lg-kpi{min-width:0;padding:5px 7px;border:1px solid var(--border-card-inner);
    border-left:3px solid var(--accent,var(--brand-blue));border-radius:2px;background:rgba(9,38,64,.3);}
  .lg-kpi .lgv{font-size:20px;line-height:1.1;font-weight:700;color:var(--accent,var(--brand-blue));
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .lg-kpi .lgv small{font-size:10px;color:var(--text-secondary);font-weight:400;margin-left:2px;}
  .lg-kpi .lgl{font-size:10px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .lg-flow{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;
    padding:6px 8px;border:1px solid var(--border-card-inner);border-radius:2px;background:rgba(9,38,64,.22);}
  .lg-flowhead{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;color:var(--text-secondary);}
  .lg-flowhead b{font-size:13px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
  .lg-bar{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--chart-track);}
  .lg-bar i{display:block;height:100%;min-width:3px;width:0;
    transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .lg-legend{display:flex;gap:9px;font-size:10px;color:var(--text-secondary);white-space:nowrap;}
  .lg-legend span{display:inline-flex;align-items:center;gap:3px;}
  .lg-legend i{width:7px;height:7px;border-radius:1px;display:inline-block;flex:0 0 7px;}

  /* 物流调度详情专用 */
  .ld-wrap{height:100%;display:flex;flex-direction:column;gap:4px;}
  .ld-legend{display:flex;gap:10px;font-size:9px;color:var(--text-secondary);flex-wrap:wrap;align-items:center;}
  .ld-legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:3px;}
  /* 库位齐套下钻 */
  .ld-drill{height:100%;display:flex;flex-direction:column;gap:6px;}
  .ld-drill-top{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto;}
  .ld-dm{padding:5px 9px 7px;border:1px solid var(--border-card-inner);border-left:3px solid var(--accent,var(--brand-blue));
    border-radius:2px;background:rgba(9,38,64,.3);}
  .ld-dm .dm-h{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;color:var(--text-secondary);}
  .ld-dm .dm-h b{font-size:17px;font-weight:700;color:var(--accent,var(--brand-blue));font-variant-numeric:tabular-nums;}
  .ld-drill-list{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .ld-dcol{display:flex;flex-direction:column;min-height:0;}
  .ld-di{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:var(--text-secondary);
    border-bottom:1px dashed rgba(150,205,220,.12);}
  .ld-di b{font-size:11px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
  /* 物流明细四指标：两列两排铺满（参考绿色低碳图标形式） */
  .ld-logi-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:6px;align-items:stretch;}
  .ld-logi{display:flex;align-items:center;gap:8px;padding:6px 12px;min-width:0;border:1px solid var(--border-card-inner);
    border-radius:3px;background:var(--gradient-card);}
  .ld-logi .li-ic{width:34px;height:34px;flex:0 0 34px;filter:drop-shadow(0 2px 3px rgba(3,20,38,.5));}
  .ld-logi .li-ic svg{width:100%;height:100%;display:block;}
  .ld-logi .li-d{min-width:0;}
  .ld-logi .li-v{font-size:16px;line-height:1.1;font-weight:700;color:var(--accent,var(--brand-cyan));font-variant-numeric:tabular-nums;white-space:nowrap;}
  .ld-logi .li-v small{font-size:10px;font-weight:400;color:var(--text-secondary);margin-left:2px;}
  .ld-logi .li-l{font-size:10px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 质量管控详情专用 */
  /* 待复检分析：物料分类 × 状态数量矩阵 */
  .qa-rc{position:absolute;left:12px;right:12px;top:6px;bottom:6px;display:flex;flex-direction:column;gap:3px;}
  .qa-rc-top{display:flex;gap:8px;flex:0 0 auto;}
  .qa-rc-sum{flex:1;display:flex;justify-content:space-between;align-items:baseline;
    padding:3px 9px;border:1px solid var(--border-card-inner);border-left:3px solid var(--accent,var(--brand-cyan));
    border-radius:2px;background:rgba(9,38,64,.3);}
  .qa-rc-sum span{font-size:10px;color:var(--text-secondary);}
  .qa-rc-sum b{font-size:16px;font-weight:700;color:var(--accent,var(--brand-cyan));font-variant-numeric:tabular-nums;}
  .qa-rc .qa-rc-tb{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed;flex:1;min-height:0;}
  .qa-rc .qa-rc-tb th{color:var(--brand-cyan);font-weight:600;font-size:9.5px;height:20px;padding:0 3px;line-height:1;
    border-bottom:1px solid var(--border-base);text-align:center;white-space:nowrap;}
  .qa-rc .qa-rc-tb th:first-child,.qa-rc .qa-rc-tb td:first-child{text-align:left;width:23%;}
  .qa-rc .qa-rc-tb td{height:20px;padding:0 3px;line-height:1;text-align:center;border-bottom:1px dashed rgba(150,205,220,.1);
    color:var(--text-secondary);font-variant-numeric:tabular-nums;}
  .qa-rc .qa-rc-tb tr:last-child td{border-bottom:0;}
  .qa-pill{display:inline-block;min-width:30px;padding:0 6px;line-height:16px;border-radius:7px;font-size:9.5px;
    font-weight:600;font-variant-numeric:tabular-nums;}
  .qa-pill.done{color:#7BE0B2;background:rgba(79,214,155,.16);}
  .qa-pill.check{color:#7BD0EA;background:rgba(111,220,234,.16);}
  .qa-pill.wait{color:#BFD4E2;background:rgba(150,205,220,.14);}
  .qa-pill.iso{color:#6FDFB4;background:rgba(46,156,116,.2);}
  /* 质量明细：复用 km-grid 两排布局，5 项第 5 项跨两列 */

  /* 安全生产：两个半圆仪表 + 底部天数条 */
  .af-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;}
  .af-rings{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-evenly;gap:6px;}
  .af-ring{display:flex;flex-direction:column;align-items:center;min-width:0;}
  .af-ring svg{width:104px;height:62px;display:block;}
  .af-glbl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);
    margin-top:-4px;white-space:nowrap;}
  .af-glbl i{width:5px;height:5px;flex:0 0 5px;border-radius:1px;}
  .af-foot{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:8px;padding:0 10px;
    background:linear-gradient(90deg,rgba(62,134,180,.55),rgba(18,62,92,.25));
    clip-path:polygon(0 0,100% 0,96% 100%,0 100%);}
  .af-foot .af-dia{width:10px;height:10px;flex:0 0 10px;background:var(--brand-cyan);
    transform:rotate(45deg);box-shadow:0 0 8px var(--glow-primary);}
  .af-foot .af-lbl{flex:1;font-size:12px;color:var(--text-secondary);letter-spacing:.5px;}
  .af-foot b{font-size:22px;font-weight:700;color:var(--accent,var(--brand-cyan));line-height:1;
    font-variant-numeric:tabular-nums;}
  .af-foot b small{font-size:11px;font-weight:400;color:var(--text-secondary);margin-left:2px;}

  /* 工厂概况视图：按右栏剩余高度铺满，避免底部留白 */
  .factory-view{height:100%;padding:6px 0;display:flex;flex-direction:column;gap:12px;}
  .fac-hero{flex:0 0 128px;height:128px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .fac-tile{position:relative;height:100%;padding:14px 14px;border:1px solid var(--border-base);border-radius:2px;
    background:linear-gradient(180deg,#154A70,#10395A);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;}
  .fac-tile::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--accent,var(--brand-cyan));}
  .fac-tile .t-lbl{font-size:13px;color:var(--text-secondary);letter-spacing:.5px;}
  .fac-tile .t-val{font-size:30px;font-weight:700;color:var(--accent,var(--brand-cyan));line-height:1.2;
    font-variant-numeric:tabular-nums;}
  .fac-tile .t-val small{font-size:14px;font-weight:400;color:var(--text-secondary);margin-left:3px;}

<!-- 提示框放在 #stage 之外：#stage 带 transform，会让 position:fixed 相对它定位，导致按 clientX/clientY 定位时错位 -->
<div class="chart-tip" id="chartTip"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const pad = n => String(n).padStart(2,'0');

  /* 时钟 */
  function tick(){
    const d = new Date();
    $('#clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    $('#date').textContent = d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
  }
  setInterval(tick,1000); tick();

  /* 2600 × 800 设计稿等比适配窗口 */
  function fit(){
    document.documentElement.style.setProperty('--s',
      Math.min(innerWidth/2600, innerHeight/800));
  }
  addEventListener('resize',fit); fit();

  /* 提示 */
  let toastTimer;
  function toast(msg){
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'),2200);
  }

  /* 图表 hover 小标签：把 data-tip 文本按「标题 / 指标行」纵向排版 */
  const escTip = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function formatTip(raw){
    let txt = String(raw==null?'':raw).trim();
    let title = '', body = txt;
    const cm = txt.match(/^([^：:]+)[：:]\s*(.*)$/);
    if(cm){ title = cm[1].trim(); body = cm[2].trim(); }
    // 主体按 / 或 · 拆成多条指标
    let parts = body.indexOf('/')>-1 ? body.split(/\s*\/\s*/)
              : body.indexOf('·')>-1 ? body.split(/\s*·\s*/) : [body];
    // 单条指标：尝试拆成「标签 / 数值」，否则整段作为值
    const rows = parts.map(p=>{
      p = p.trim(); if(!p) return '';
      const pm = p.match(/^([^：:\d]+?)[：:]\s*(.*)$/);   // 标签：数值
      if(pm) return `<div class="ct-row"><span class="ct-k">${escTip(pm[1].trim())}：</span><span class="ct-v">${escTip(pm[2].trim())}</span></div>`;
      const sm = p.match(/^(\D+?)\s+([\d].*)$/);           // 标签 数值（数值以数字开头）
      if(sm) return `<div class="ct-row"><span class="ct-k">${escTip(sm[1].trim())}：</span><span class="ct-v">${escTip(sm[2].trim())}</span></div>`;
      return `<div class="ct-row"><span class="ct-v">${escTip(p)}</span></div>`;
    }).filter(Boolean).join('');
    const head = title ? `<div class="ct-title">${escTip(title)}${rows?'：':''}</div>` : '';
    return head + rows;
  }
  const chartTip = $('#chartTip');
  document.addEventListener('pointermove', e => {
    const target = e.target.closest && e.target.closest('[data-tip]');
    if(!target){ chartTip.style.display='none'; return; }
    chartTip.innerHTML = formatTip(target.getAttribute('data-tip'));
    chartTip.style.display = 'block';
    // 锚定到命中元素（数据点/扇区/柱）顶部正上方，不再跟鼠标走，避免标签飘动
    const r = target.getBoundingClientRect();
    const tw = chartTip.offsetWidth, th = chartTip.offsetHeight;
    const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
    const gap = Math.max(4, 6 * s);
    let x = r.left + r.width/2 - tw/2;
    let y = r.top - th - gap;
    // 边界约束：不出视口；上方空间不足时翻到元素下方
    x = Math.max(6, Math.min(x, innerWidth - tw - 6));
    if(y < 6) y = r.bottom + gap;
    chartTip.style.left = x + 'px';
    chartTip.style.top = y + 'px';
  }, true);
  document.addEventListener('pointerdown', () => { chartTip.style.display='none'; }, true);

  /* 通用详情弹窗 */
  const modal = $('#modal');
  function openModal(title,src){
    if(!src) return;
    $('#modalTitle').textContent = title;
    $('#modalImg').src = src;
    modal.style.display = 'flex';
  }
  function closeModal(){ modal.style.display='none'; }
  $('#modalClose').addEventListener('click',closeModal);
  modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

  $$('[data-title][data-img]').forEach(btn=>{
    btn.addEventListener('click',()=>openModal(btn.dataset.title,btn.dataset.img));
  });

  /* 工作站切换：一层 11 个入口下拉（右侧按楼层显示） */

    const assembly = name === '墙板拼装工作站';
    mediaPairs.forEach(([video, still]) => {
      still.src = image;
      const useVideo = assembly && video.dataset.failed !== 'true';
      video.hidden = !useVideo;
      still.hidden = useVideo;
      if (useVideo) {
        video.play().catch(() => { video.hidden = true; still.hidden = false; });
      } else video.pause();
    });
  }
  mediaPairs.forEach(([video, still]) => {
    video.addEventListener('error', () => {
      video.dataset.failed = 'true';
      video.hidden = true;
      still.hidden = false;
    });
  });

    {code:'A01',name:'墙板拼装工作站',img:'../assets/images/参观大屏-墙板拼装.png',video:'../assets/images/标准作业工序.mp4',task:'MP20261019001',out:'79 / 110',prog:'72%'},

    {code:'A08',name:'墙面底漆喷涂工作站',img:'../assets/images/参观大屏-腻子喷涂.png'},

  const stationPop = $('#stationPop');

    btn.addEventListener('click', e=>{

      $$('#stationPopGrid button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      $('#taskName').textContent = st.name;
      $('#taskWoCode').textContent = st.task || 'MP20261019001';
      $('#taskOutput').textContent = st.out || '79 / 110';
      $('#taskProgress').textContent = st.prog || '72%';
      syncStationMedia(st.name, st.img);
      stationPop.classList.remove('open');
      toast('已切换至 ' + st.name);
    });
  });
  document.addEventListener('click', ()=>stationPop.classList.remove('open'));

  /* ===== 工单生产详情弹窗 ===== */
  const woModal = $('#woModal');
  const woField = (k,v,cls='') => `<div class="wo-field"><span class="wf-k">${k}</span><span class="wf-v ${cls}">${v}</span></div>`;
  const woTable = (cols,rows,cls='') => `<table class="wo-table ${cls}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  function renderWoTaskPane(){

          ${woField('产品 / 交付物','混凝土模块标准办公模块 3')}
          ${woField('产品编码','CM-MODULE-003')}
          ${woField('规格','混凝土标准办公模块')}

  }
  function renderWoDevicePane(){

  function energy24Chart(values, labels, unit, maxY, ticks){
    const w=1300,h=150,pl=44,pr=14,pt=8,pb=22, iw=w-pl-pr, ih=h-pt-pb;
    const pts=values.map((v,i)=>[pl+i*iw/(values.length-1), pt+ih-(v/maxY)*ih]);
    const area=`M${pl},${pt+ih} `+pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0].toFixed(1)},${pt+ih} Z`;
    const grad='eg'+(++egid);
    const grid=ticks.map(t=>{ const y=pt+ih-(t/maxY)*ih;
      return `<line class="grid" x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}"/><text class="ax" x="${pl-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${t}</text>`; }).join('');
    const xl=[0,2,4,6,8,10,11].map(i=>`<text class="ax" x="${pts[i][0].toFixed(1)}" y="${h-4}" text-anchor="middle">${labels[i]}</text>`).join('');
    const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#3E86B4" stroke="#DFF6FF" stroke-width=".8"/>`).join('');
    const tips=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="10" fill="transparent" pointer-events="all" data-tip="${tipEsc(labels[i].slice(0,2)+'时：'+values[i]+' '+unit)}"/>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3E86B4" stop-opacity=".35"/><stop offset="1" stop-color="#3E86B4" stop-opacity="0"/></linearGradient></defs>
      ${grid}${xl}<path d="${area}" fill="url(#${grad})"/>
      <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3E86B4" stroke-width="2" stroke-linejoin="round"/>
      ${dots}${tips}</svg>`;
  }

      ${dot?`<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${color}" class="fade-up"/>`:''}
      ${data.map((v,i)=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="7" fill="transparent" pointer-events="all" data-tip="${tipEsc(tipLbl(i)+'：'+v)}"/>`).join('')}

  function multiLine(series, colors, {h=60,w=220}={}){
    let out='';
    series.forEach((data,si)=>{
      const all=series.flat(), min=Math.min(...all), max=Math.max(...all), span=(max-min)||1;
      const pts=data.map((v,i)=>[4+i*(w-8)/(data.length-1), h-7-((v-min)/span)*(h-18)]);
      const len=Math.round(Math.hypot(w,h)*1.8);
      out+=`<polyline class="line-anim" points="${pts.map(p=>p.join(',')).join(' ')}" fill="none"
        stroke="${colors[si]}" stroke-width="2" stroke-linecap="round" style="--len:${len}"/>`;
      out+=`<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.6" fill="${colors[si]}" class="fade-up"/>`;
      data.forEach((v,j)=>{ out+=`<circle cx="${pts[j][0].toFixed(1)}" cy="${pts[j][1].toFixed(1)}" r="7" fill="transparent" pointer-events="all" data-tip="系列${si+1} · ${tipEsc(tipLbl(j)+'：'+v)}"/>`; });
    });
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${out}</svg>`;
  }
  function barsChart(data, colors, {h=60,w=220}={}){
    const max=Math.max(...data)||1, n=data.length, slot=(w-8)/n, bw=Math.min(slot*.5,26);
    let bars='';
    data.forEach((v,i)=>{
      const c=colors[i%colors.length], bh=Math.max(3,(v/max)*(h-16));
      const x=4+slot*i+(slot-bw)/2, y=h-6-bh;
      bars+=`<rect class="bar-anim" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
        height="${bh.toFixed(1)}" rx="1.5" fill="${c}" style="animation-delay:${i*70}ms"
        data-tip="${tipEsc(tipLbl(i)+'：'+v)}"/>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>`;
  }
  function gridLines(h,w,n=4,base=24){
    let s=''; for(let i=1;i<=n;i++){ const y=h-base-(h-base-16)*i/n;
      s+=`<line class="grid-ln" x1="30" y1="${y.toFixed(1)}" x2="${w-8}" y2="${y.toFixed(1)}"/>`; }
    return s;
  }
  function groupedBars(groups, colors, {h=210,w=560,labels=[],unit=''}={}){
    const flat=groups.flat(), max=Math.max(...flat)||1, gw=(w-50)/groups.length;
    let s=gridLines(h,w);
    groups.forEach((g,gi)=>{
      const bw=Math.min(gw*.26,30);
      g.forEach((v,si)=>{
        const bh=(v/max)*(h-52), x=30+gi*gw+gw/2-bw+si*(bw+4), y=h-28-bh;
        s+=`<rect class="bar-anim" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}"
          rx="2" fill="${colors[si]}" style="animation-delay:${gi*110+si*60}ms"
          data-tip="${tipEsc((labels[gi]||('第'+(gi+1)+'组'))+'：'+v)}"/>`;
        s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" fill="${colors[si]}" font-size="12"
          text-anchor="middle">${v}</text>`;
      });
      if(labels[gi]) s+=`<text x="${(30+gi*gw+gw/2).toFixed(1)}" y="${h-9}" class="ax-lbl" text-anchor="middle">${labels[gi]}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${s}</svg>`;

  function donut(pct, color, center, sub, size=110){
    const R=42, circ=2*Math.PI*R, off=circ*(1-Math.min(100,Math.max(0,pct))/100);
    return `<svg viewBox="0 0 110 110" width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet">

        stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 55 55)" style="--len:${circ.toFixed(1)};--off:${off.toFixed(1)}"
        data-tip="${tipEsc((sub||'占比')+'：'+(center!=null?center:pct+'%'))}"/>
      <text x="55" y="${sub?52:60}" fill="${color}" font-size="22" font-weight="700" text-anchor="middle">${center!=null?center:pct+'%'}</text>

  /* 质量管控：双轴面积曲线（左=合格数量，右=不合格数量；配色即图例，省去底部注释） */
  function dualAxisArea(a,b,ca,cb,months){
    const w=280,h=74,L=34,R=248,T=16,B=58;
    const amin=Math.min(...a)*.92,amax=Math.max(...a)*1.03;
    const bmax=Math.max(...b)*1.18;
    const px=i=>L+i*(R-L)/(a.length-1);
    const ay=v=>B-(v-amin)/(amax-amin)*(B-T);
    const by=v=>B-(v/bmax)*(B-T);
    let s='';
    /* 内嵌图例 */
    s+=`<text x="${L}" y="10" fill="${ca}" font-size="9">■ 合格数量(件)</text>`;
    s+=`<text x="${L+96}" y="10" fill="${cb}" font-size="9">■ 不合格数量(件)</text>`;
    for(let i=0;i<=3;i++){
      const y=B-i*(B-T)/3;
      s+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${R}" y2="${y.toFixed(1)}" stroke="rgba(150,205,220,.12)" stroke-dasharray="3 3"/>`;
      s+=`<text x="${L-3}" y="${(y+3).toFixed(1)}" fill="${ca}" font-size="9" text-anchor="end">${Math.round(amin+(amax-amin)*i/3)}</text>`;
      s+=`<text x="${R+3}" y="${(y+3).toFixed(1)}" fill="${cb}" font-size="9" text-anchor="start">${Math.round(bmax*i/3)}</text>`;
    }
    [[a,ay,ca],[b,by,cb]].forEach(([data,f,c],k)=>{
      const pts=data.map((v,i)=>[px(i),f(v)]);
      const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      const gr='da'+(++gid);
      const area=`M${pts[0][0].toFixed(1)},${B} `+pts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0].toFixed(1)},${B} Z`;
      s+=`<defs><linearGradient id="${gr}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${c}" stop-opacity=".36"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>`;
      s+=`<path d="${area}" fill="url(#${gr})"/>`;
      s+=`<polyline points="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`;
      s+=`<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.6" fill="${c}"/>`;
    });
    a.forEach((v,i)=>{
      s+=`<circle cx="${px(i).toFixed(1)}" cy="${B-10}" r="14" fill="transparent" pointer-events="all"
        data-tip="${tipEsc(months[i]+'：合格 '+v+' 件 / 不合格 '+b[i]+' 件')}"/>`;
    });
    months.forEach((m,i)=>{
      if(i%2===0) s+=`<text x="${px(i).toFixed(1)}" y="${h-2}" fill="#7FA8BF" font-size="9" text-anchor="middle">${m}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${s}</svg>`;
  }
  /* 仓储：四段饼图 */
  function pieChart(items){
    const cx=50,cy=50,r=38,total=items.reduce((a,b)=>a+b.v,0);
    let ang=-Math.PI/2,s='';
    items.forEach((it,i)=>{
      const a2=ang+it.v/total*Math.PI*2;
      const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
      const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      const large=(a2-ang)>Math.PI?1:0;
      s+=`<path d="M${cx} ${cy} L${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z"
        fill="${it.c}" opacity=".86" stroke="rgba(11,44,71,.7)" stroke-width="1" class="donut-anim" style="animation-delay:${i*80}ms"
        data-tip="${tipEsc((it.l||('分类'+(i+1)))+'：'+it.v.toLocaleString()+' 件 · '+(it.v/total*100).toFixed(1)+'%')}"/>`;
      ang=a2;
    });
    s+=`<circle cx="${cx}" cy="${cy}" r="17" fill="#0B2C47"/>`;
    s+=`<text x="${cx}" y="${cy-1}" fill="#EAF6FF" font-size="11" font-weight="700" text-anchor="middle">${total.toLocaleString()}</text>`;
    s+=`<text x="${cx}" y="${cy+11}" fill="#7FA8BF" font-size="8" text-anchor="middle">件</text>`;
    return `<svg class="pie-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${s}</svg>`;

      s+=`<text x="${w-R+4}" y="${(yy+3).toFixed(1)}" fill="${GR}" font-size="8">${Math.round(ngMax*k/4)}</text>`;
    }

  function halfGauge(pct,color,center,unit,label,tip){

    const arc=(rad,a0,a1)=>{
      const p0=pt(rad,a0),p1=pt(rad,a1);
      return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+rad+' '+rad+' 0 0 0 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1);

    return `<svg viewBox="0 0 104 66" preserveAspectRatio="xMidYMid meet">

  /* ---- 工厂概况：平滑趋势曲线（参考图：纵轴 0-10 虚线网格 + 峰值白点高亮） ---- */
  function facTrend(data, labels, color, {w=560,h=140,max=10}={}){
    const L=28,R=10,T=10,B=24, pw=w-L-R, ph=h-T-B;
    const X=i=>L+i*pw/(data.length-1), Y=v=>T+ph-(v/max)*ph;
    const pts=data.map((v,i)=>[X(i),Y(v)]);
    // Catmull-Rom → 三次贝塞尔，得到平滑曲线
    let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    const grad=uid();
    let s=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity=".34"/>
        <stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
    for(let v=0;v<=max;v+=2){
      const y=Y(v);
      s+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${w-R}" y2="${y.toFixed(1)}" stroke="rgba(150,205,220,.14)" stroke-dasharray="3 4"/>`;
      s+=`<text x="${L-5}" y="${(y+3).toFixed(1)}" fill="#7FA8BF" font-size="9" text-anchor="end">${v}</text>`;
    }
    const area=`${d} L${X(data.length-1).toFixed(1)},${Y(0).toFixed(1)} L${X(0).toFixed(1)},${Y(0).toFixed(1)} Z`;
    s+=`<path d="${area}" fill="url(#${grad})" class="fade-up"/>`;
    s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" class="line-anim" style="--len:${Math.ceil(pw*2.4)}"/>`;
    const pk=data.indexOf(Math.max(...data));

  /* ---- 详情通用柱状图：分组双柱 / 多系列堆叠，12 月横轴 + 数量纵轴 ---- */
  function detailBars(cats, series, colors, labels, {h=210,w=560,mode='grouped'}={}){
    const L=44,R=12,T=28,B=30, plotW=w-L-R, plotH=h-T-B;
    const totals=cats.map((_,i)=> mode==='stacked'
      ? series.reduce((a,s)=>a+(s[i]||0),0)
      : Math.max(...series.map(s=>s[i]||0)));
    const max=Math.max(...totals,1)*1.12;
    let s='';
    for(let i=0;i<=4;i++){
      const y=T+plotH-plotH*i/4;
      s+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${w-R}" y2="${y.toFixed(1)}" stroke="rgba(150,205,220,.14)" stroke-dasharray="3 3"/>`;
      s+=`<text x="${L-4}" y="${(y+3).toFixed(1)}" fill="#7FA8BF" font-size="9" text-anchor="end">${Math.round(max*i/4).toLocaleString()}</text>`;
    }
    const slot=plotW/cats.length;
    cats.forEach((cat,ci)=>{
      if(mode==='stacked'){
        let acc=0;
        series.forEach((data,si)=>{
          const v=data[ci]||0, bh=v/max*plotH, y=T+plotH-acc-bh;
          acc+=bh;
          s+=`<rect class="bar-anim" x="${(L+ci*slot+slot*.22).toFixed(1)}" y="${y.toFixed(1)}" width="${(slot*.56).toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" fill="${colors[si]}" style="animation-delay:${ci*30+si*20}ms"
            data-tip="${tipEsc(cat+' · '+(labels[si]||('系列'+(si+1)))+'：'+v)}"/>`;
        });
      }else{
        const n=series.length, bw=Math.min(slot*.3,16), gap=2, gw=bw*n+gap*(n-1);
        series.forEach((data,si)=>{
          const v=data[ci]||0, bh=v/max*plotH;
          const x=L+ci*slot+(slot-gw)/2+si*(bw+gap);
          s+=`<rect class="bar-anim" x="${x.toFixed(1)}" y="${(T+plotH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" fill="${colors[si]}" style="animation-delay:${ci*30+si*20}ms"
            data-tip="${tipEsc(cat+' · '+(labels[si]||('系列'+(si+1)))+'：'+v)}"/>`;
        });
      }
      s+=`<text x="${(L+ci*slot+slot/2).toFixed(1)}" y="${h-10}" fill="#7FA8BF" font-size="9" text-anchor="middle">${cat}</text>`;
    });
    labels.forEach((lb,i)=>{
      const x=L+i*Math.min(plotW/labels.length,110);
      s+=`<rect x="${x.toFixed(1)}" y="7" width="7" height="7" fill="${colors[i]}"/>`;
      s+=`<text x="${(x+10).toFixed(1)}" y="14" fill="#BFD4E2" font-size="9">${lb}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${s}</svg>`;
  }

  /* 详情：精确绘制的环形饼图（避免 dash 偏移带来的尾部错位） */
  function pieDonut(pct,color,num,label=''){
    const cx=50,cy=50,r=38;
    const a0=-90,a1=-90+360*pct/100;
    const pt=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
    const p0=pt(a0),p1=pt(a1),large=pct>50?1:0;
    const d='M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1);
    return `<svg viewBox="0 0 100 100" width="96" height="96" preserveAspectRatio="xMidYMid meet">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(150,205,220,.16)" stroke-width="9"/>
      <path class="donut-anim" d="${d}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="butt"
        data-tip="${tipEsc((label||'占比')+'：'+num)}"/>
      <circle cx="${cx}" cy="${cy}" r="${r-9}" fill="none" stroke="${color}" stroke-opacity=".12" stroke-width="1"/>
      <text x="50" y="55" fill="${color}" font-size="20" font-weight="700" text-anchor="middle">${num}</text>
    </svg>`;
  }

  /* ===== 设备运行详情专用图表（尽量不复用其他弹窗图表形式） ===== */
  function ringArc(cx,cy,r,w,a0,a1){
    const ro=r+w/2,ri=r-w/2;
    const p=(rad,a)=>[cx+rad*Math.cos(a*Math.PI/180),cy+rad*Math.sin(a*Math.PI/180)];
    const o0=p(ro,a0),o1=p(ro,a1),i1=p(ri,a1),i0=p(ri,a0),lg=(a1-a0)>180?1:0;
    return `M${o0[0].toFixed(1)} ${o0[1].toFixed(1)} A${ro} ${ro} 0 ${lg} 1 ${o1[0].toFixed(1)} ${o1[1].toFixed(1)} `+
      `L${i1[0].toFixed(1)} ${i1[1].toFixed(1)} A${ri} ${ri} 0 ${lg} 0 ${i0[0].toFixed(1)} ${i0[1].toFixed(1)} Z`;
  }

      `<div class="detail-kpi fade-up" style="--accent:${k.c};animation-delay:${i*50}ms">
        <div class="dk-lbl">${k.l}</div>
        <div class="dk-val"><span data-count="${k.v.replace(/,/g,'')}" data-dec="${k.v.includes('.')?1:0}"
          data-fmt="${k.v.includes(',')?'comma':''}">0</span><small>${k.u}</small></div>
        <div class="dk-sub">${k.s}</div></div>`).join('');
    $('#detailCharts').innerHTML=d.charts.map(detailChartHTML).join('');
    $('#detailModal').style.display='flex';
    animateView($('#detailModal'));
    toast('已展开：'+d.title);
  }

  /* ---- 数字滚动 + 进度条缓动 ---- */
  function countUp(el){
    const raw=el.dataset.count; if(raw==null) return;
    const target=parseFloat(raw), dec=parseInt(el.dataset.dec||'0'), comma=el.dataset.fmt==='comma';
    const dur=1000, t0=performance.now();
    const fmt=n=> comma ? n.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})
                        : n.toFixed(dec);
    (function frame(t){
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=fmt(target*e);
      if(p<1) requestAnimationFrame(frame);
    })(t0);
  }
  function animateView(root){
    root.querySelectorAll('[data-count]').forEach(countUp);
    root.querySelectorAll('.mini-meters .mt i,.hb-fill,.lg-bar i').forEach(i=>{
      const w=i.dataset.w; i.style.width='0';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ i.style.width=w+'%'; }));
    });
  }

  /* ---- 首次渲染 + 视图切换（左侧完全不动） ---- */
  $('#opsGrid').innerHTML=OPS.map(opsCard).join('');
  $('#factoryView').innerHTML=factoryHTML();
  animateView($('#viewOps'));

  const detailModal=$('#detailModal');
  function closeDetail(){ detailModal.style.display='none'; }

  let curView='ops';
  function switchView(v){
    curView=v;
    closeDetail();
    closeWo();
    const factory=v==='factory';
    // 单按钮：文字跟随当前视图，点击即切到另一视图
    $('#viewName').textContent = factory ? '工厂概况' : '运营分析';
    $('#viewToggle').title = factory ? '点击切换到：运营分析' : '点击切换到：工厂概况';
    $('#viewOps').classList.toggle('active',!factory);
    $('#viewFactory').classList.toggle('active',factory);
    const root = factory ? $('#viewFactory') : $('#viewOps');
    // 重新触发入场与数字动画（仅右侧指标区）
    root.querySelectorAll('.fade-up,.line-anim,.bar-anim,.meter-anim,.donut-anim').forEach(el=>{
      el.style.animation='none'; void el.offsetWidth; el.style.animation='';
    });
    animateView(root);
  }
  $('#viewToggle').addEventListener('click',()=>switchView(curView==='ops'?'factory':'ops'));

  /* 详情入口（事件委托）：点击标题或隐藏的详情按钮 */
  $('#opsGrid').addEventListener('click',e=>{
    const b=e.target.closest('.detail-btn'); if(b){ openDetail(b.dataset.detail); return; }
    const h=e.target.closest('.p-head-click'); if(h) openDetail(h.dataset.detail);
  });
  $('#detailClose').addEventListener('click',closeDetail);
  detailModal.addEventListener('click',e=>{ if(e.target===detailModal) closeDetail(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&detailModal.style.display==='flex') closeDetail(); });
})();
</script>
</body>
</html>
